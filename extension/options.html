<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Argus settings</title>
    <link rel="stylesheet" href="argus.css" />
    <style>
      body { padding: 48px 24px; }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 64px; }
      form { margin-top: 32px; display: grid; gap: 26px; }
      label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      label.field input { height: 36px; background: transparent; border: 0; border-bottom: 1px solid var(--rule); outline: none; color: var(--fg); font-size: 15px; }
      label.field input:focus { border-bottom-color: var(--fg); }
      .row { display: flex; align-items: center; gap: 8px; }
      .row input { accent-color: var(--fg); }
      button { justify-self: start; height: 42px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; cursor: pointer; }
      #saved { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="display">Settings</h1>
      <form id="form">
        <label class="field">
          Argus scanning engine
          <input id="api" required />
        </label>
        <label class="field">
          Argus web app (for full evidence)
          <input id="app" required />
        </label>
        <label class="row"><input id="protect" type="checkbox" /> Warn me before dangerous pages open</label>
        <div class="row">
          <button type="submit">Save</button>
          <span id="saved" class="muted" role="status"></span>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
